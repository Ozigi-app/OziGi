<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    :root {
      color-scheme: light dark;
      --brand: #E8320A;
      --bg: #ffffff;
      --fg: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --surface: #f8fafc;
      --field: #ffffff;
      --ok: #16a34a;
      --warn: #b45309;
      --warn-bg: #fffbeb;
      --warn-line: #fde68a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1220; --fg: #e2e8f0; --muted: #94a3b8; --line: #1e293b;
        --surface: #0f172a; --field: #1e293b;
        --ok: #4ade80; --warn: #fbbf24; --warn-bg: #1c1917; --warn-line: #422006;
      }
    }

    * { box-sizing: border-box; }
    body {
      width: 320px; margin: 0; padding: 0;
      font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--fg);
    }

    header {
      display: flex; align-items: center; gap: 9px;
      padding: 14px 16px; border-bottom: 1px solid var(--line);
    }
    .mark {
      width: 22px; height: 22px; border-radius: 6px; flex: none;
      background: var(--brand); color: #fff;
      display: grid; place-items: center;
      font-weight: 800; font-size: 12px; letter-spacing: -.02em;
    }
    .title { font-size: 13px; font-weight: 700; letter-spacing: -.01em; }
    /* Status pill doubles as the only always-visible answer to "is it working?" */
    .status {
      margin-left: auto; display: inline-flex; align-items: center; gap: 5px;
      font-size: 11px; font-weight: 600; color: var(--muted);
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #cbd5e1; flex: none; }
    .dot.on { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 20%, transparent); }

    main { padding: 14px 16px 16px; }

    .switches { display: grid; gap: 2px; margin-bottom: 14px; }
    .sw {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 10px; border-radius: 9px; cursor: pointer;
      border: 1px solid transparent;
    }
    .sw:hover { background: var(--surface); }
    .sw input { margin: 0; flex: none; accent-color: var(--brand); width: 15px; height: 15px; }
    .sw-label { font-weight: 600; }
    .sw-sub { display: block; font-weight: 400; font-size: 11px; color: var(--muted); }

    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .stat {
      background: var(--surface); border: 1px solid var(--line);
      border-radius: 10px; padding: 9px 11px;
    }
    .stat b { display: block; font-size: 19px; line-height: 1.2; letter-spacing: -.02em; }
    .stat span { font-size: 11px; color: var(--muted); }
    .stat.off b { color: var(--muted); }

    /* Messaging is gated off in DEFAULTS. Saying so here prevents the obvious
       misreading of "Messages today: 0" as a bug. */
    .notice {
      display: flex; gap: 8px; align-items: flex-start;
      background: var(--warn-bg); border: 1px solid var(--warn-line);
      color: var(--warn); border-radius: 9px; padding: 9px 11px;
      font-size: 11px; line-height: 1.4; margin-bottom: 14px;
    }
    .notice b { font-weight: 700; }

    /* This drawer holds the connection token — the one thing without which the
       extension does nothing at all. It must read as a control, not as fine
       print, or it looks like the field is missing. */
    details {
      border: 1px solid var(--line); border-radius: 10px;
      padding: 10px 12px; background: var(--surface);
    }
    details[open] { padding-bottom: 14px; }
    summary {
      cursor: pointer; font-size: 12px; font-weight: 700; color: var(--fg);
      list-style: none; user-select: none;
      display: flex; align-items: center; gap: 6px;
    }
    summary::-webkit-details-marker { display: none; }
    summary::before { content: "▸"; color: var(--muted); }
    details[open] summary::before { content: "▾"; }
    /* Turns amber when no token is saved, so a fresh install can't miss it. */
    .needs-token { margin-left: auto; font-size: 10px; font-weight: 700; color: var(--warn); }
    .needs-token:empty { display: none; }

    label { display: block; font-weight: 600; margin: 12px 0 5px; font-size: 11px; }
    input[type=text] {
      width: 100%; padding: 8px 9px; border: 1px solid var(--line);
      border-radius: 8px; font: inherit; font-size: 12px;
      background: var(--field); color: var(--fg);
    }
    input[type=text]:focus { outline: 2px solid color-mix(in srgb, var(--brand) 45%, transparent); outline-offset: 1px; border-color: var(--brand); }
    .hint { color: var(--muted); font-size: 11px; margin-top: 4px; }
    code { background: var(--surface); padding: 1px 4px; border-radius: 4px; font-size: 10px; }

    .actions { display: flex; gap: 8px; margin-top: 14px; }
    button {
      font: inherit; font-weight: 700; font-size: 12px; border: 0;
      border-radius: 9px; padding: 9px 12px; cursor: pointer;
    }
    .primary { background: var(--brand); color: #fff; flex: 1; }
    .primary:hover { filter: brightness(1.07); }
    .ghost { background: var(--surface); color: var(--fg); border: 1px solid var(--line); }
    .ghost:hover { border-color: var(--muted); }

    #msg { font-size: 11px; color: var(--muted); margin-top: 9px; min-height: 14px; }
    a { color: var(--brand); }
  </style>
</head>
<body>
  <header>
    <div class="mark">O</div>
    <div>
      <div class="title">Ozigi LinkedIn Sender</div>
    </div>
    <span class="status"><span class="dot" id="dot"></span><span id="statusText">Off</span></span>
  </header>

  <main>
    <div class="switches">
      <label class="sw">
        <input type="checkbox" id="enabled" />
        <span class="sw-label">Active
          <span class="sw-sub">Finds leads and sends connection requests, at a human pace</span>
        </span>
      </label>
    </div>

    <div class="stats">
      <div class="stat"><b id="cCount">–</b><span>Connects today</span></div>
      <div class="stat"><b id="lCount">–</b><span>Leads found today</span></div>
    </div>

    <details id="settings">
      <summary>Connection settings<span class="needs-token" id="tokenWarn"></span></summary>

      <label for="token">Connection token</label>
      <input type="text" id="token" placeholder="Paste from Ozigi → Settings" autocomplete="off" spellcheck="false" />
      <div class="hint">Get it in <a href="https://ozigi.app/dashboard/gtm/settings" target="_blank" rel="noreferrer">Ozigi Settings</a>.</div>

      <!-- Visible and editable on purpose. This was previously only settable
           from the service worker console, so a value set once sat there
           throttling everything with nothing on screen to explain it. -->
      <label for="cap">Connection requests per day</label>
      <input type="number" id="cap" min="1" max="100" step="1" />
      <div class="hint">LinkedIn tolerates roughly 20&ndash;25 a day. Higher risks a restriction.</div>

      <!-- Kept for development against a local server, but no longer advertised:
           a user who changes it points the extension at nothing and the pipeline
           silently stops. -->
      <label for="apiBase">Ozigi URL</label>
      <input type="text" id="apiBase" placeholder="https://ozigi.app" autocomplete="off" spellcheck="false" />
      <div class="hint">Leave this as <code>https://ozigi.app</code>.</div>
    </details>

    <div class="actions">
      <button class="primary" id="save">Save</button>
      <button class="ghost" id="run">Run now</button>
    </div>
    <div id="msg"></div>
  </main>

  <script src="popup.js"></script>
</body>
</html>
