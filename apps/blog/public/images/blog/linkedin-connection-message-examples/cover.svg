<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070E1C"/>
      <stop offset="100%" stop-color="#0F1E35"/>
    </linearGradient>
    <radialGradient id="glow" cx="73%" cy="50%" r="42%">
      <stop offset="0%" stop-color="#E8320A" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#E8320A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="15%" cy="22%" r="30%">
      <stop offset="0%" stop-color="#1E4A8A" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0A1628" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <g stroke="#1E293B" stroke-width="1" opacity="0.4">
    <line x1="580" y1="70"  x2="1160" y2="70"/>
    <line x1="580" y1="150" x2="1160" y2="150"/>
    <line x1="580" y1="230" x2="1160" y2="230"/>
    <line x1="580" y1="310" x2="1160" y2="310"/>
    <line x1="580" y1="390" x2="1160" y2="390"/>
    <line x1="580" y1="470" x2="1160" y2="470"/>
    <line x1="580" y1="550" x2="1160" y2="550"/>
    <line x1="630"  y1="40" x2="630"  y2="590"/>
    <line x1="710"  y1="40" x2="710"  y2="590"/>
    <line x1="790"  y1="40" x2="790"  y2="590"/>
    <line x1="870"  y1="40" x2="870"  y2="590"/>
    <line x1="950"  y1="40" x2="950"  y2="590"/>
    <line x1="1030" y1="40" x2="1030" y2="590"/>
    <line x1="1110" y1="40" x2="1110" y2="590"/>
  </g>

  <!-- Mock connection note bubble -->
  <text x="660" y="96" font-family="'DM Sans','Inter',monospace" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="1">CONNECTION NOTE · 200 CHAR LIMIT</text>
  <rect x="660" y="106" width="480" height="86" rx="10" fill="#1A2540" stroke="#16a34a" stroke-width="1"/>
  <text x="680" y="130" font-family="'DM Sans','Inter',sans-serif" font-size="13" fill="#FAFAFA">"Read your post on schema drift. The part</text>
  <text x="680" y="150" font-family="'DM Sans','Inter',sans-serif" font-size="13" fill="#FAFAFA">about catching it pre-deploy is the first</text>
  <text x="680" y="170" font-family="'DM Sans','Inter',sans-serif" font-size="13" fill="#FAFAFA">honest take I've seen on it."</text>
  <text x="1000" y="185" font-family="'DM Sans','Inter',monospace" font-size="11" fill="#16a34a">142/200</text>

  <!-- 7 situations pills -->
  <text x="660" y="216" font-family="'DM Sans','Inter',monospace" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="1">7 SITUATIONS COVERED</text>
  <g font-family="'DM Sans','Inter',sans-serif" font-size="12" fill="#FAFAFA">
    <rect x="660" y="226" width="118" height="30" rx="15" fill="#1E293B"/><text x="719" y="246" text-anchor="middle">community</text>
    <rect x="786" y="226" width="100" height="30" rx="15" fill="#1E293B"/><text x="836" y="246" text-anchor="middle">content</text>
    <rect x="894" y="226" width="100" height="30" rx="15" fill="#1E293B"/><text x="944" y="246" text-anchor="middle">trigger</text>
    <rect x="1002" y="226" width="90" height="30" rx="15" fill="#1E293B"/><text x="1047" y="246" text-anchor="middle">mutual</text>
    <rect x="660" y="264" width="90" height="30" rx="15" fill="#1E293B"/><text x="705" y="284" text-anchor="middle">event</text>
    <rect x="758" y="264" width="110" height="30" rx="15" fill="#1E293B"/><text x="813" y="284" text-anchor="middle">founder ask</text>
    <rect x="876" y="264" width="130" height="30" rx="15" fill="#1E293B"/><text x="941" y="284" text-anchor="middle">professional</text>
  </g>

  <!-- After the accept sequence -->
  <rect x="660" y="304" width="480" height="76" rx="8" fill="#0F1828" stroke="#1E293B" stroke-width="1"/>
  <text x="680" y="326" font-family="'DM Sans','Inter',sans-serif" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="1">AFTER THE ACCEPT</text>
  <text x="680" y="348" font-family="'DM Sans','Inter',monospace" font-size="12" fill="#FAFAFA">DM 1: react, no ask · DM 2: bridge, soft ask</text>
  <text x="680" y="368" font-family="'DM Sans','Inter',monospace" font-size="12" fill="#94A3B8">DM 3: the honest ask, only if engaged</text>

  <rect x="660" y="392" width="480" height="44" rx="8" fill="#1E2D4A" stroke="#E8320A" stroke-width="1"/>
  <text x="680" y="414" font-family="'DM Sans','Inter',sans-serif" font-size="11" font-weight="700" fill="#E8320A" letter-spacing="1">THE MISTAKE</text>
  <text x="680" y="430" font-family="'DM Sans','Inter',monospace" font-size="12" fill="#FAFAFA">the pitch that arrives 40 seconds after accept</text>

  <g fill="none" stroke="#1E3A5F" stroke-width="1.5" opacity="0.5">
    <path d="M710 460 L710 550 L790 550"/>
    <path d="M950 460 L950 550 L1030 550 L1030 460"/>
  </g>
  <g fill="#E8320A" opacity="0.85"><circle cx="1030" cy="460" r="4"/></g>
  <g fill="none" stroke="#E8320A" stroke-width="1" opacity="0.3"><circle cx="1030" cy="460" r="11"/></g>

  <rect x="80" y="88" width="112" height="30" rx="6" fill="#E8320A"/>
  <text x="136" y="108" text-anchor="middle" font-family="'DM Sans','Inter',sans-serif" font-size="12" font-weight="700" fill="#FAFAFA" letter-spacing="1">MARKETING</text>
  <text x="206" y="108" font-family="'DM Sans','Inter',sans-serif" font-size="12" fill="#94A3B8" letter-spacing="2">·  2026</text>

  <text x="80" y="175" font-family="'DM Sans','Inter','Helvetica Neue',sans-serif" font-size="42" font-weight="800" fill="#FAFAFA">LinkedIn</text>
  <text x="80" y="225" font-family="'DM Sans','Inter','Helvetica Neue',sans-serif" font-size="42" font-weight="800" fill="#FAFAFA">Connection</text>
  <text x="80" y="275" font-family="'DM Sans','Inter','Helvetica Neue',sans-serif" font-size="42" font-weight="800" fill="#E8320A">Messages</text>

  <text x="80" y="320" font-family="'DM Sans','Inter',sans-serif" font-size="19" fill="#94A3B8">That get accepted, and what's next.</text>

  <line x1="80" y1="348" x2="460" y2="348" stroke="#1E293B" stroke-width="1"/>

  <rect x="80"  y="364" width="150" height="36" rx="18" fill="#1E293B"/>
  <text x="155" y="387" text-anchor="middle" font-family="'DM Sans','Inter',sans-serif" font-size="13" fill="#FAFAFA">7 examples</text>
  <rect x="242" y="364" width="180" height="36" rx="18" fill="#1E293B"/>
  <text x="332" y="387" text-anchor="middle" font-family="'DM Sans','Inter',sans-serif" font-size="13" fill="#FAFAFA">after-accept DMs</text>

  <text x="80"  y="598" font-family="'DM Sans','Inter',sans-serif" font-size="13" font-weight="700" fill="#E8320A" letter-spacing="3">OZIGI</text>
  <text x="136" y="598" font-family="'DM Sans','Inter',sans-serif" font-size="13" fill="#94A3B8" opacity="0.7">  ·  blog.ozigi.app</text>

  <rect x="0" y="0" width="6" height="630" fill="#E8320A"/>
</svg>
