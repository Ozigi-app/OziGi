<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070E1C"/>
      <stop offset="100%" stop-color="#0F1E35"/>
    </linearGradient>
    <radialGradient id="glow" cx="73%" cy="50%" r="42%">
      <stop offset="0%" stop-color="#E8320A" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#E8320A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="15%" cy="22%" r="30%">
      <stop offset="0%" stop-color="#1E4A8A" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0A1628" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Grid -->
  <g stroke="#1E293B" stroke-width="1" opacity="0.4">
    <line x1="580" y1="70"  x2="1160" y2="70"/>
    <line x1="580" y1="150" x2="1160" y2="150"/>
    <line x1="580" y1="230" x2="1160" y2="230"/>
    <line x1="580" y1="310" x2="1160" y2="310"/>
    <line x1="580" y1="390" x2="1160" y2="390"/>
    <line x1="580" y1="470" x2="1160" y2="470"/>
    <line x1="580" y1="550" x2="1160" y2="550"/>
    <line x1="630"  y1="40" x2="630"  y2="590"/>
    <line x1="710"  y1="40" x2="710"  y2="590"/>
    <line x1="790"  y1="40" x2="790"  y2="590"/>
    <line x1="870"  y1="40" x2="870"  y2="590"/>
    <line x1="950"  y1="40" x2="950"  y2="590"/>
    <line x1="1030" y1="40" x2="1030" y2="590"/>
    <line x1="1110" y1="40" x2="1110" y2="590"/>
  </g>

  <!-- Publishing order panel -->
  <text x="660" y="96" font-family="'DM Sans','Inter',monospace" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="1">PUBLISH IN THIS ORDER</text>

  <rect x="660" y="106" width="480" height="38" rx="6" fill="#1A2540" stroke="#16a34a" stroke-width="1"/>
  <text x="680" y="122" font-family="'DM Sans','Inter',monospace" font-size="12" font-weight="700" fill="#16a34a">1</text>
  <text x="700" y="122" font-family="'DM Sans','Inter',monospace" font-size="12" fill="#FAFAFA">Comparison &amp; alternative pages</text>
  <text x="680" y="138" font-family="'DM Sans','Inter',monospace" font-size="11" fill="#6B7E99">reader is already shopping</text>

  <rect x="660" y="150" width="480" height="38" rx="6" fill="#1A2540" stroke="#16a34a" stroke-width="1" opacity="0.85"/>
  <text x="680" y="166" font-family="'DM Sans','Inter',monospace" font-size="12" font-weight="700" fill="#16a34a">2</text>
  <text x="700" y="166" font-family="'DM Sans','Inter',monospace" font-size="12" fill="#FAFAFA">Problem posts</text>
  <text x="680" y="182" font-family="'DM Sans','Inter',monospace" font-size="11" fill="#6B7E99">reader has the pain you solve</text>

  <rect x="660" y="194" width="480" height="38" rx="6" fill="#1A2540" stroke="#1E293B" stroke-width="1" opacity="0.85"/>
  <text x="680" y="210" font-family="'DM Sans','Inter',monospace" font-size="12" font-weight="700" fill="#94A3B8">3</text>
  <text x="700" y="210" font-family="'DM Sans','Inter',monospace" font-size="12" fill="#FAFAFA">Use case &amp; how-to guides</text>
  <text x="680" y="226" font-family="'DM Sans','Inter',monospace" font-size="11" fill="#6B7E99">reader is doing the job you automate</text>

  <rect x="660" y="238" width="480" height="38" rx="6" fill="#1A2540" stroke="#1E293B" stroke-width="1" opacity="0.7"/>
  <text x="680" y="254" font-family="'DM Sans','Inter',monospace" font-size="12" font-weight="700" fill="#94A3B8">4</text>
  <text x="700" y="254" font-family="'DM Sans','Inter',monospace" font-size="12" fill="#FAFAFA">Opinion &amp; teardown posts</text>
  <text x="680" y="270" font-family="'DM Sans','Inter',monospace" font-size="11" fill="#6B7E99">builds the reputation that earns clicks</text>

  <!-- Weekly loop -->
  <rect x="660" y="282" width="480" height="76" rx="8" fill="#0F1828" stroke="#1E293B" stroke-width="1"/>
  <text x="680" y="304" font-family="'DM Sans','Inter',sans-serif" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="1">WEEKLY LOOP · ONE PERSON</text>
  <text x="680" y="326" font-family="'DM Sans','Inter',monospace" font-size="12" fill="#FAFAFA">Mon: pick topic · One block: draft</text>
  <text x="680" y="346" font-family="'DM Sans','Inter',monospace" font-size="12" fill="#94A3B8">Fri: distribute · ~5 hrs/week total</text>

  <!-- Timeline to results -->
  <rect x="660" y="376" width="480" height="60" rx="8" fill="#1E2D4A" stroke="#E8320A" stroke-width="1"/>
  <text x="680" y="398" font-family="'DM Sans','Inter',sans-serif" font-size="11" font-weight="700" fill="#E8320A" letter-spacing="1">TIME TO MEANINGFUL TRAFFIC</text>
  <rect x="680" y="408" width="320" height="10" rx="2" fill="#1E293B"/>
  <rect x="680" y="408" width="210" height="10" rx="2" fill="#E8320A" opacity="0.85"/>
  <text x="1008" y="420" font-family="'DM Sans','Inter',monospace" font-size="14" font-weight="700" fill="#FAFAFA">4–8</text>
  <text x="1050" y="420" font-family="'DM Sans','Inter',monospace" font-size="11" fill="#94A3B8">months</text>

  <!-- Circuit traces -->
  <g fill="none" stroke="#1E3A5F" stroke-width="1.5" opacity="0.5">
    <path d="M710 460 L710 550 L790 550"/>
    <path d="M950 460 L950 550 L1030 550 L1030 460"/>
  </g>
  <g fill="#E8320A" opacity="0.85"><circle cx="1030" cy="460" r="4"/></g>
  <g fill="none" stroke="#E8320A" stroke-width="1" opacity="0.3"><circle cx="1030" cy="460" r="11"/></g>

  <!-- Left side text -->
  <rect x="80" y="88" width="112" height="30" rx="6" fill="#E8320A"/>
  <text x="136" y="108" text-anchor="middle" font-family="'DM Sans','Inter',sans-serif" font-size="12" font-weight="700" fill="#FAFAFA" letter-spacing="1">MARKETING</text>
  <text x="206" y="108" font-family="'DM Sans','Inter',sans-serif" font-size="12" fill="#94A3B8" letter-spacing="2">·  2026</text>

  <text x="80" y="205" font-family="'DM Sans','Inter','Helvetica Neue',sans-serif" font-size="56" font-weight="800" fill="#FAFAFA">Content</text>
  <text x="80" y="275" font-family="'DM Sans','Inter','Helvetica Neue',sans-serif" font-size="56" font-weight="800" fill="#FAFAFA">Marketing for</text>
  <text x="80" y="345" font-family="'DM Sans','Inter','Helvetica Neue',sans-serif" font-size="56" font-weight="800" fill="#E8320A">Startups</text>

  <text x="80" y="398" font-family="'DM Sans','Inter',sans-serif" font-size="21" fill="#94A3B8">A playbook for a team of one.</text>

  <line x1="80" y1="426" x2="460" y2="426" stroke="#1E293B" stroke-width="1"/>

  <rect x="80"  y="442" width="150" height="36" rx="18" fill="#1E293B"/>
  <text x="155" y="465" text-anchor="middle" font-family="'DM Sans','Inter',sans-serif" font-size="13" fill="#FAFAFA">one channel</text>
  <rect x="242" y="442" width="180" height="36" rx="18" fill="#1E293B"/>
  <text x="332" y="465" text-anchor="middle" font-family="'DM Sans','Inter',sans-serif" font-size="13" fill="#FAFAFA">bottom-of-funnel first</text>

  <rect x="80"  y="486" width="150" height="36" rx="18" fill="#1E293B"/>
  <text x="155" y="509" text-anchor="middle" font-family="'DM Sans','Inter',sans-serif" font-size="13" fill="#FAFAFA">no team needed</text>

  <text x="80"  y="598" font-family="'DM Sans','Inter',sans-serif" font-size="13" font-weight="700" fill="#E8320A" letter-spacing="3">OZIGI</text>
  <text x="136" y="598" font-family="'DM Sans','Inter',sans-serif" font-size="13" fill="#94A3B8" opacity="0.7">  ·  blog.ozigi.app</text>

  <rect x="0" y="0" width="6" height="630" fill="#E8320A"/>
</svg>
