  <text x="660" y="96" font-family="'DM Sans','Inter',monospace" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="1">45 SIGN-OFFS, SORTED BY SIGNAL</text>

  <rect x="660" y="106" width="480" height="66" rx="8" fill="#1A2540" stroke="#16a34a" stroke-width="1"/>
  <text x="680" y="128" font-family="'DM Sans','Inter',sans-serif" font-size="11" font-weight="700" fill="#16a34a" letter-spacing="1">SAFE DEFAULTS</text>
  <text x="680" y="150" font-family="'DM Sans','Inter',monospace" font-size="12" fill="#FAFAFA">Best · Thanks · Regards</text>
  <text x="680" y="166" font-family="'DM Sans','Inter',monospace" font-size="11" fill="#94A3B8">covers 90% of professional email</text>

  <rect x="660" y="180" width="480" height="50" rx="8" fill="#1A2540" stroke="#1E293B" stroke-width="1"/>
  <text x="680" y="200" font-family="'DM Sans','Inter',sans-serif" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="1">WARM TIER</text>
  <text x="680" y="220" font-family="'DM Sans','Inter',monospace" font-size="12" fill="#FAFAFA">Warm regards · Cheers · Talk soon</text>

  <rect x="660" y="238" width="480" height="50" rx="8" fill="#1A2540" stroke="#1E293B" stroke-width="1"/>
  <text x="680" y="258" font-family="'DM Sans','Inter',sans-serif" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="1">FORMAL TIER</text>
  <text x="680" y="278" font-family="'DM Sans','Inter',monospace" font-size="12" fill="#FAFAFA">Sincerely · Respectfully</text>

  <rect x="660" y="296" width="480" height="80" rx="8" fill="#1E2D4A" stroke="#E8320A" stroke-width="1"/>
  <text x="680" y="318" font-family="'DM Sans','Inter',sans-serif" font-size="11" font-weight="700" fill="#E8320A" letter-spacing="1">WORKING AGAINST YOU</text>
  <text x="680" y="338" font-family="'DM Sans','Inter',monospace" font-size="12" fill="#FAFAFA">"Thanks in advance" — presumes the yes</text>
  <text x="680" y="356" font-family="'DM Sans','Inter',monospace" font-size="12" fill="#FAFAFA">"Cordially" — reads cold, not polite</text>
  <text x="680" y="374" font-family="'DM Sans','Inter',monospace" font-size="11" fill="#94A3B8">"Best wishes" — greeting-card register</text>

